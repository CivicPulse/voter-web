# Voter Participation History API Contract
# Endpoint consumed by the voter detail page's history card

openapi: 3.0.3
info:
  title: Voter History API
  version: 1.0.0

paths:
  /voters/{voter_registration_number}/history:
    get:
      summary: Get a voter's election participation history
      description: |
        Returns all elections a voter has participated in, ordered by election date descending.
        Accessible to all authenticated users (no role restriction).
        Filtering is performed client-side; the API returns the full history.
      operationId: getVoterHistory
      tags:
        - Voters
      parameters:
        - name: voter_registration_number
          in: path
          required: true
          description: The voter's registration number (e.g., "12345678")
          schema:
            type: string
      responses:
        "200":
          description: Voter's participation history (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoterHistoryResponse"
              example:
                items:
                  - election_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    election_name: "US Senate - General"
                    election_date: "2024-11-05"
                    election_type: "general"
                    voting_method: "In Person"
                  - election_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    election_name: "State House District 145 - Primary"
                    election_date: "2024-05-21"
                    election_type: "primary"
                    voting_method: "Early Voting"
                pagination:
                  total: 2
                  page: 1
                  page_size: 20
                  total_pages: 1
        "401":
          description: Authentication required
        "404":
          description: Voter not found

components:
  schemas:
    VoterHistoryResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoterParticipationRecord"
        pagination:
          $ref: "#/components/schemas/PaginationInfo"

    PaginationInfo:
      type: object
      required: [total, page, page_size, total_pages]
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer

    VoterParticipationRecord:
      type: object
      required:
        - election_id
        - election_name
        - election_date
        - election_type
        - voting_method
      properties:
        election_id:
          type: string
          format: uuid
          description: UUID of the election
        election_name:
          type: string
          description: Display name of the election/race
        election_date:
          type: string
          format: date
          description: Election date (YYYY-MM-DD)
        election_type:
          type: string
          enum: [general, primary, special, runoff]
          description: Type of election
        voting_method:
          type: string
          description: How the voter cast their ballot (e.g., "In Person", "Absentee by Mail", "Early Voting")
